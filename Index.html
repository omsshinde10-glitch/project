<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Canteen Management System</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            font-size: 30px;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 25px auto;
        }

        .status {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        h2 {
            margin: 20px 0;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .food-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .food-card h3 {
            margin-bottom: 10px;
        }

        .category {
            color: #777;
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .cart-box {
            background: white;
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .quantity button {
            padding: 5px 9px;
            margin: 0 4px;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .checkout {
            margin-top: 20px;
            background: #16803c;
        }

        .checkout:hover {
            background: #0d632c;
        }

        .form-box {
            display: none;
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        label {
            font-weight: bold;
        }

        .place-order {
            background: #0069d9;
            width: 100%;
            margin-top: 10px;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        .empty {
            color: #777;
            padding: 15px 0;
        }
    </style>
</head>

<body>

<header>
    <h1>🍴 Canteen Management System</h1>
    <p>Online Food Ordering System</p>
</header>

<div class="container">

    <!-- DATABASE STATUS -->
    <div class="status">
        <p>Database Status</p>
        <p id="status">Connecting...</p>
        <p id="error" class="error"></p>
    </div>

    <!-- MENU -->
    <h2>🍔 Available Menu</h2>

    <div id="menu" class="menu">
        Loading menu...
    </div>

    <!-- CART -->
    <div class="cart-box">

        <h2>🛒 Shopping Cart</h2>

        <div id="cart">
            <p class="empty">Your cart is empty.</p>
        </div>

        <div class="total">
            Total: ₹<span id="cartTotal">0.00</span>
        </div>

        <button class="checkout" onclick="showCheckout()">
            Proceed to Checkout
        </button>

    </div>

    <!-- CUSTOMER FORM -->
    <div class="form-box" id="checkoutForm">

        <h2>👤 Customer Details</h2>

        <label>Customer Name</label>
        <input
            type="text"
            id="customerName"
            placeholder="Enter your name"
        >

        <label>Phone Number</label>
        <input
            type="tel"
            id="customerPhone"
            placeholder="Enter phone number"
        >

        <label>Email</label>
        <input
            type="email"
            id="customerEmail"
            placeholder="Enter email"
        >

        <label>Payment Method</label>

        <select id="paymentMethod">
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
        </select>

        <button
            class="place-order"
            onclick="placeOrder()"
        >
            Place Order
        </button>

        <p id="orderMessage" class="message"></p>

    </div>

</div>


<script>

    // =====================================================
    // SUPABASE CONNECTION
    // =====================================================

    const SUPABASE_URL = "https://syeypwzfhilsqzuqcsuk.supabase.co";

    const SUPABASE_KEY = "sb_publishable_2IioGlm3Ji9O1g52HWKvew_K7odBHcU";

    const { createClient } = supabase;

    const db = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // =====================================================
    // CART
    // =====================================================

    let cart = [];

    let menuItems = [];


    // =====================================================
    // LOAD MENU
    // =====================================================

    async function loadMenu() {

        const menuContainer =
            document.getElementById("menu");

        const status =
            document.getElementById("status");

        const error =
            document.getElementById("error");

        try {

            const { data, error: dbError } =
                await db
                    .from("menu_items")
                    .select("*")
                    .eq("availability", true)
                    .order("item_id");

            if (dbError) {
                throw dbError;
            }

            menuItems = data;

            status.innerHTML =
                '<span class="success">Connected to Supabase ✅</span>';

            error.textContent = "";

            menuContainer.innerHTML = "";

            data.forEach(item => {

                const card =
                    document.createElement("div");

                card.className = "food-card";

                card.innerHTML = `
                    <h3>${item.item_name}</h3>

                    <p class="category">
                        Category: ${item.category}
                    </p>

                    <p class="price">
                        ₹${Number(item.price).toFixed(2)}
                    </p>

                    <button onclick="addToCart(${item.item_id})">
                        Add to Cart
                    </button>
                `;

                menuContainer.appendChild(card);

            });

        }
        catch (err) {

            console.error(err);

            status.innerHTML =
                '<span class="error">Connection Failed ❌</span>';

            error.textContent =
                err.message;

            menuContainer.innerHTML = "";

        }

    }


    // =====================================================
    // ADD TO CART
    // =====================================================

    function addToCart(itemId) {

        const item =
            menuItems.find(
                product => product.item_id === itemId
            );

        if (!item) return;

        const existing =
            cart.find(
                product => product.item_id === itemId
            );

        if (existing) {

            existing.quantity++;

        }
        else {

            cart.push({
                item_id: item.item_id,
                item_name: item.item_name,
                price: Number(item.price),
                quantity: 1
            });

        }

        displayCart();

    }


    // =====================================================
    // DISPLAY CART
    // =====================================================

    function displayCart() {

        const cartContainer =
            document.getElementById("cart");

        const totalElement =
            document.getElementById("cartTotal");

        if (cart.length === 0) {

            cartContainer.innerHTML =
                '<p class="empty">Your cart is empty.</p>';

            totalElement.textContent = "0.00";

            return;
        }

        cartContainer.innerHTML = "";

        let total = 0;

        cart.forEach((item, index) => {

            const itemTotal =
                item.price * item.quantity;

            total += itemTotal;

            const div =
                document.createElement("div");

            div.className = "cart-item";

            div.innerHTML = `

                <div>
                    <strong>${item.item_name}</strong>
                    <br>
                    ₹${item.price.toFixed(2)}
                </div>

                <div class="quantity">

                    <button onclick="decreaseQuantity(${index})">
                        -
                    </button>

                    ${item.quantity}

                    <button onclick="increaseQuantity(${index})">
                        +
                    </button>

                </div>

                <div>
                    ₹${itemTotal.toFixed(2)}
                </div>
            `;

            cartContainer.appendChild(div);

        });

        totalElement.textContent =
            total.toFixed(2);

    }


    // =====================================================
    // INCREASE QUANTITY
    // =====================================================

    function increaseQuantity(index) {

        cart[index].quantity++;

        displayCart();

    }


    // =====================================================
    // DECREASE QUANTITY
    // =====================================================

    function decreaseQuantity(index) {

        cart[index].quantity--;

        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }

        displayCart();

    }


    // =====================================================
    // SHOW CHECKOUT
    // =====================================================

    function showCheckout() {

        if (cart.length === 0) {

            alert("Please add at least one item to the cart.");

            return;
        }

        const form =
            document.getElementById("checkoutForm");

        form.style.display = "block";

        form.scrollIntoView({
            behavior: "smooth"
        });

    }


    // =====================================================
    // PLACE ORDER
    // =====================================================

    async function placeOrder() {

        const name =
            document.getElementById("customerName")
                .value.trim();

        const phone =
            document.getElementById("customerPhone")
                .value.trim();

        const email =
            document.getElementById("customerEmail")
                .value.trim();

        const paymentMethod =
            document.getElementById("paymentMethod")
                .value;

        const message =
            document.getElementById("orderMessage");


        // -----------------------------
        // VALIDATION
        // -----------------------------

        if (!name || !phone) {

            message.className =
                "message error";

            message.textContent =
                "Please enter customer name and phone number.";

            return;
        }

        if (cart.length === 0) {

            message.className =
                "message error";

            message.textContent =
                "Cart is empty.";

            return;
        }


        message.className =
            "message";

        message.textContent =
            "Processing order...";


        try {

            // =========================================
            // 1. FIND CUSTOMER
            // =========================================

            let { data: customer, error: customerError } =
                await db
                    .from("customers")
                    .select("*")
                    .eq("phone", phone)
                    .maybeSingle();

            if (customerError) {
                throw customerError;
            }


            // =========================================
            // 2. CREATE CUSTOMER IF NEW
            // =========================================

            if (!customer) {

                const result =
                    await db
                        .from("customers")
                        .insert({
                            customer_name: name,
                            phone: phone,
                            email: email || null
                        })
                        .select()
                        .single();

                if (result.error) {
                    throw result.error;
                }

                customer = result.data;

            }


            // =========================================
            // 3. CALCULATE TOTAL
            // =========================================

            let total = 0;

            cart.forEach(item => {

                total +=
                    item.price * item.quantity;

            });


            // =========================================
            // 4. CREATE ORDER
            // =========================================

            const orderResult =
                await db
                    .from("orders")
                    .insert({
                        customer_id:
                            customer.customer_id,

                        total_amount:
                            total,

                        order_status:
                            "Pending"
                    })
                    .select()
                    .single();

            if (orderResult.error) {
                throw orderResult.error;
            }

            const order =
                orderResult.data;


            // =========================================
            // 5. CREATE ORDER ITEMS
            // =========================================

            const orderItems =
                cart.map(item => ({

                    order_id:
                        order.order_id,

                    item_id:
                        item.item_id,

                    quantity:
                        item.quantity,

                    price:
                        item.price

                }));


            const itemsResult =
                await db
                    .from("order_items")
                    .insert(orderItems);


            if (itemsResult.error) {
                throw itemsResult.error;
            }


            // =========================================
            // 6. CREATE PAYMENT RECORD
            // =========================================

            const paymentResult =
                await db
                    .from("payments")
                    .insert({

                        order_id:
                            order.order_id,

                        payment_method:
                            paymentMethod,

                        payment_status:
                            "Pending",

                        amount:
                            total

                    });


            if (paymentResult.error) {
                throw paymentResult.error;
            }


            // =========================================
            // 7. SUCCESS
            // =========================================

            message.className =
                "message success";

            message.innerHTML = `
                ✅ Order placed successfully!<br><br>

                Order ID:
                <strong>#${order.order_id}</strong>
                <br>

                Total:
                <strong>₹${total.toFixed(2)}</strong>
                <br>

                Payment:
                <strong>${paymentMethod}</strong>
            `;


            // Clear cart

            cart = [];

            displayCart();


            // Clear customer form

            document.getElementById("customerName")
                .value = "";

            document.getElementById("customerPhone")
                .value = "";

            document.getElementById("customerEmail")
                .value = "";


        }
        catch (err) {

            console.error(err);

            message.className =
                "message error";

            message.textContent =
                "Order failed: " + err.message;

        }

    }


    // =====================================================
    // START APPLICATION
    // =====================================================

    loadMenu();

</script>

</body>
</html>
